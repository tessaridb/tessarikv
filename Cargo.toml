[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/tessaridb/tessarikv"
homepage = "https://github.com/tessaridb/tessarikv"
authors = ["TessariDB"]
keywords = ["database", "key-value", "lsm", "storage-engine", "lock-free"]
categories = ["database-implementations", "concurrency", "data-structures"]

[workspace.dependencies]
tessarikv-constants = { path = "crates/tessarikv-constants", version = "0.1.0" }
tessarikv-types = { path = "crates/tessarikv-types", version = "0.1.0" }
tessarikv-sync = { path = "crates/tessarikv-sync", version = "0.1.0" }
tessarikv-format = { path = "crates/tessarikv-format", version = "0.1.0" }
thiserror = "2.0.21"
crc32c = "0.6.8"
crossbeam-utils = "0.8.23"
rustix = { version = "1.1.5", features = ["fs"] }
proptest = "1.12.0"
loom = "0.7.2"
tempfile = "3.23.0"
papaya = "0.2.5"
tokio = { version = "1.53.3", default-features = false }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }

[workspace.lints.clippy]
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
cast_precision_loss = "deny"
unwrap_used = "deny"
expect_used = "deny"
as_conversions = "deny"
panic = "deny"
arithmetic_side_effects = "warn"
todo = "warn"
unimplemented = "warn"
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false
