[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/tessaridb/tessarikv"
homepage = "https://github.com/tessaridb/tessarikv"
authors = ["TessariDB", "boogvar"]
keywords = ["database", "key-value", "lsm", "storage-engine", "lock-free"]
categories = ["database-implementations", "concurrency", "data-structures"]

[workspace.dependencies]
tessarikv-constants = { path = "crates/tessarikv-constants", version = "0.1.0" }
tessarikv-types = { path = "crates/tessarikv-types", version = "0.1.0" }
tessarikv-sync = { path = "crates/tessarikv-sync", version = "0.1.0" }
tessarikv-format = { path = "crates/tessarikv-format", version = "0.1.0" }
thiserror = "2.0.21"
crc32c = "0.6.8"
lz4_flex = { version = "0.14.0", default-features = false, features = ["safe-encode", "safe-decode", "std"] }
snap = "1.1.2"
ruzstd = { version = "0.9.1", default-features = false, features = ["std"] }
miniz_oxide = { version = "0.9.1", default-features = false, features = ["with-alloc"] }
crossbeam-utils = "0.8.23"
rustix = { version = "1.1.5", features = ["fs"] }
proptest = "1.12.0"
loom = "0.7.2"
tempfile = "3.23.0"
papaya = "0.2.5"
tokio = { version = "1.53.3", default-features = false }
arc-swap = "1.7.1"
aes-gcm = { version = "0.11.1", features = ["zeroize"] }
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
hkdf = "0.13.0"
sha2 = "0.11.0"
zeroize = "1.9.1"
getrandom = "0.4.3"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)", "cfg(fuzzing)"] }

[workspace.lints.clippy]
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
cast_precision_loss = "deny"
unwrap_used = "deny"
expect_used = "deny"
as_conversions = "deny"
panic = "deny"
arithmetic_side_effects = "warn"
todo = "warn"
unimplemented = "warn"
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false
