[package]
name = "tessarikv-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"
authors = ["TessariDB", "boogvar"]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.10"
tessarikv-format = { path = "../crates/tessarikv-format" }

# Not a member of the engine's workspace: fuzzing needs a nightly toolchain and is never published.
[workspace]
members = ["."]

[[bin]]
name = "table_open"
path = "fuzz_targets/table_open.rs"
test = false
doc = false
bench = false

[[bin]]
name = "batch_decode"
path = "fuzz_targets/batch_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "log_frames"
path = "fuzz_targets/log_frames.rs"
test = false
doc = false
bench = false

[[bin]]
name = "manifest_decode"
path = "fuzz_targets/manifest_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "seal_header"
path = "fuzz_targets/seal_header.rs"
test = false
doc = false
bench = false
