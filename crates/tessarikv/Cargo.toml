[package]
name = "tessarikv"
description = "A pure-Rust, lock-free-first LSM key-value storage engine"
readme = "../../README.md"
version = "0.0.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
tessarikv-constants.workspace = true
tessarikv-types.workspace = true
tessarikv-sync.workspace = true
tessarikv-format.workspace = true
thiserror.workspace = true
papaya.workspace = true
arc-swap = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "macros", "time"] }

[target.'cfg(target_vendor = "apple")'.dependencies]
rustix.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
rustix.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "test-util"] }
proptest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
